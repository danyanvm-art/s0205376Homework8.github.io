<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Обратная связь</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <button id="openBtn">Обратная связь</button>

  <!-- Попап поверх страницы -->
  <div id="popup" class="popup">
    <div class="popup-box">
      <button id="closeBtn" class="close" type="button">×</button>
      <h2>Обратная связь</h2>

      <form id="form">
        <input type="text" name="fio" id="fio" placeholder="ФИО" required>
        <input type="email" name="email" id="email" placeholder="Email" required>
        <input type="tel" name="phone" id="phone" placeholder="Телефон" required>
        <input type="text" name="organization" id="organization" placeholder="Организация">
        <textarea name="message" id="message" rows="3" placeholder="Сообщение" required></textarea>

        <label class="check">
          <input type="checkbox" name="agree" id="agree" required>
          Согласен с политикой обработки персональных данных
        </label>

        <button type="submit" id="sendBtn">Отправить</button>
      </form>

      <p id="result"></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
